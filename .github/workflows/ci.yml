# F4.1 — Real CI. Replaces the old "CreatorOS Runner Diagnostic" heartbeat.
# Pipeline: install -> typecheck -> lint -> build -> artifact gate -> unit tests.
# Prettier runs non-blocking (continue-on-error) until the one-time repo-wide
# format pass lands (deliberately deferred to avoid merge conflicts with
# in-flight branches — see F4.3).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, build, artifact gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Build
        run: npm run build

      - name: Artifact freshness gate (api/_server.js vs server.ts)
        run: npm run check:artifact

      # F4.4 — unit tests (Vitest, services-layer focus per D5-A).
      - name: Unit tests
        run: npm run test:unit

  # F4.5 — E2E smoke against the Firebase Emulator Suite. The specs never hit
  # live backends: Firebase runs locally (auth :9099, firestore :8080, started
  # by playwright.config.ts webServer) with a seeded test user, and every
  # /api/* route is mocked via page.route. Chromium only (D5-A: smoke-sized,
  # no full browser matrix).
  e2e-smoke:
    name: E2E smoke (Firebase emulators + mocked APIs, chromium only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up JDK 21 (Firebase emulators require >= 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm ci
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium

      - name: Run e2e suite (emulators + mocked APIs)
        run: npx playwright test --project=chromium

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore

  format:
    name: Prettier check (non-blocking until repo-wide format pass)
    runs-on: ubuntu-latest
    continue-on-error: true # TODO: flip to enforcing after the one-time repo-wide `prettier --write` commit (deferred — see F4.3)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier check
        run: npx prettier --check .
