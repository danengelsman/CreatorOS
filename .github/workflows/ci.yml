name: CreatorOS Runner Diagnostic

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-test:
    name: GitHub Actions runner test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Report runner
        run: |
          echo "CreatorOS GitHub Actions runner is alive"
          echo "Runner OS: $RUNNER_OS"
          echo "Runner name: $RUNNER_NAME"
      - name: Check Node and npm
        run: |
          node --version
          npm --version
