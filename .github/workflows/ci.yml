# F4.1 — Real CI. Replaces the old "CreatorOS Runner Diagnostic" heartbeat.
# Pipeline: install -> typecheck -> lint -> build -> artifact gate -> unit tests.
# Prettier runs non-blocking (continue-on-error) until the one-time repo-wide
# format pass lands (deliberately deferred to avoid merge conflicts with
# in-flight branches — see F4.3).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, build, artifact gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Build
        run: npm run build

      - name: Artifact freshness gate (api/_server.js vs server.ts)
        run: npm run check:artifact

      # F4.4 — unit tests (Vitest, services-layer focus per D5-A).
      - name: Unit tests
        run: npm run test:unit

      # TODO (Week 4, F4.5): add the Playwright e2e smoke job here once the
      # specs run against the Firebase Emulator Suite with mocked Gemini —
      # they currently hit live Firebase auth and embed credentials, so
      # wiring them now would make every CI run red. When that job lands,
      # upload playwright-report/ and test-results/ on failure with
      # actions/upload-artifact@v4 (if: failure()).

  format:
    name: Prettier check (non-blocking until repo-wide format pass)
    runs-on: ubuntu-latest
    continue-on-error: true # TODO: flip to enforcing after the one-time repo-wide `prettier --write` commit (deferred — see F4.3)
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prettier check
        run: npx prettier --check .
